<style>
/* Layout: left rail + content on desktop, top scrolling nav on phones. Teal ink with marigold accent, drawn from temple-brass and monsoon-green rather than cream. */
:root{
  --bg:#eef3f3; --surface:#ffffff; --surface2:#f5f9f9; --ink:#12262b; --muted:#54696d; --line:#d6e0e1; --line2:#b9c9cb;
  --brand:#0d4a50; --brand-ink:#ffffff; --brand-soft:#d9eceb;
  --accent:#e29a14; --accent-ink:#2b1c00; --accent-soft:#fbeccb;
  --good:#1c7a4a; --good-soft:#d9f0e3; --warn:#9a5b00; --warn-soft:#fdeccc; --bad:#b2352a; --bad-soft:#fadcd8;
  --display:'Rozha One','Mukta',Georgia,serif; --body:'Mukta','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1719; --surface:#142427; --surface2:#1a2d30; --ink:#e6f0f0; --muted:#97adb0; --line:#26393c; --line2:#38504f;
  --brand:#6fc7c0; --brand-ink:#052a2a; --brand-soft:#17383a;
  --accent:#f0b13c; --accent-ink:#2b1c00; --accent-soft:#3a2d10;
  --good:#5cc78c; --good-soft:#143a28; --warn:#f0b13c; --warn-soft:#3a2d10; --bad:#f08a7e; --bad-soft:#40201c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1719; --surface:#142427; --surface2:#1a2d30; --ink:#e6f0f0; --muted:#97adb0; --line:#26393c; --line2:#38504f;
  --brand:#6fc7c0; --brand-ink:#052a2a; --brand-soft:#17383a;
  --accent:#f0b13c; --accent-ink:#2b1c00; --accent-soft:#3a2d10;
  --good:#5cc78c; --good-soft:#143a28; --warn:#f0b13c; --warn-soft:#3a2d10; --bad:#f08a7e; --bad-soft:#40201c; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-weight:400;font-size:clamp(1.6rem,3.4vw,2.2rem);line-height:1.15}
h2{font-size:1.1rem;font-weight:700}
h3{font-size:.98rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.85rem} .tn{font-variant-numeric:tabular-nums}
.lbl{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.sample{background:var(--accent-soft);color:var(--ink);border:1px dashed var(--accent);border-radius:8px;padding:8px 12px;margin-top:12px;font-size:.85rem}

header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:14px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.mark{width:38px;height:38px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--display);font-size:.95rem}
.brand b{font-family:var(--display);font-weight:400;font-size:1.25rem;display:block;line-height:1.1}
.brand span{font-size:.78rem;color:var(--muted)}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctl select,.ctl button{background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:6px 10px;cursor:pointer}

.shell{display:grid;grid-template-columns:210px minmax(0,1fr);gap:24px;align-items:start}
nav.rail{display:flex;flex-direction:column;gap:2px;position:sticky;top:12px}
nav.rail button{display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
nav.rail button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.rail button:hover{background:var(--surface);color:var(--ink)}
nav.rail button[aria-current="page"]{background:var(--brand);color:var(--brand-ink)}
nav.rail .sep{margin:10px 12px 4px}
main{min-width:0;display:flex;flex-direction:column;gap:20px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card.flat{background:var(--surface2)}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.grid.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.stack{display:flex;flex-direction:column;gap:12px}
.pagehead{display:flex;flex-direction:column;gap:4px}
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:8px;padding:8px 16px;font-weight:600;cursor:pointer}
.btn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line2)}
.btn.gold{background:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
.pill{display:inline-block;font-size:.74rem;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--brand-soft);color:var(--brand)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.gold{background:var(--accent-soft);color:var(--warn)}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.8rem;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--surface);border-radius:99px;padding:3px 12px;cursor:pointer;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);padding-bottom:0}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:600}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.stat b{display:block;font-family:var(--display);font-weight:400;font-size:1.9rem;line-height:1.1}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.bar.gold i{background:var(--accent)}
.hero{background:var(--brand);color:var(--brand-ink);border-radius:14px;padding:22px;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));align-items:center}
.hero .lbl{color:inherit;opacity:.75}
.hero .btn{background:var(--accent);color:var(--accent-ink)}
.hero h2{font-family:var(--display);font-weight:400;font-size:1.5rem}

.list{display:flex;flex-direction:column}
.item{display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start;min-width:0}
.item:first-child{border-top:0;padding-top:0}
.item>div{min-width:0}
.date{flex:none;width:56px;text-align:center;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--surface)}
.date i{display:block;font-style:normal;background:var(--accent);color:var(--accent-ink);font-size:.7rem;font-weight:700;letter-spacing:.08em;padding:1px 0}
.date b{display:block;font-family:var(--display);font-weight:400;font-size:1.4rem;line-height:1.3}
.av{flex:none;width:42px;height:42px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700}
.av.f{background:var(--accent-soft);color:var(--warn)}

.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px}
th{text-align:left;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line2)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}

.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.tile{aspect-ratio:4/3;border-radius:8px;display:grid;place-items:end start;padding:6px 8px;font-size:.72rem;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.album{cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column}
.album:hover{border-color:var(--brand)}
.album .cover{aspect-ratio:16/10;display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:1.5rem;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.album .meta{padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.mh{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.mh h2{font-family:var(--display);font-weight:400;font-size:1.4rem}

.tree{overflow-x:auto;padding:8px 4px 16px}
.tree ul{display:flex;justify-content:center;padding:20px 0 0;margin:0;position:relative;width:max-content;min-width:100%}
.tree ul ul::before{content:"";position:absolute;top:0;left:50%;border-left:1px solid var(--line2);height:20px}
.tree li{list-style:none;text-align:center;position:relative;padding:20px 8px 0}
.tree li::before,.tree li::after{content:"";position:absolute;top:0;right:50%;width:50%;height:20px;border-top:1px solid var(--line2)}
.tree li::after{right:auto;left:50%;border-left:1px solid var(--line2)}
.tree li:only-child::before,.tree li:only-child::after{display:none}
.tree li:only-child{padding-top:0}
.tree li:first-child::before,.tree li:last-child::after{border:0 none}
.tree li:last-child::before{border-right:1px solid var(--line2);border-radius:0 6px 0 0}
.tree li:first-child::after{border-radius:6px 0 0 0}
.tree>ul{padding-top:0}
.tree>ul>li{padding-top:0}
.tree>ul>li::before,.tree>ul>li::after{display:none}
.couple{display:inline-flex;align-items:center;gap:0}
.couple .join{width:14px;height:1px;background:var(--accent)}
.node{background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;display:flex;gap:8px;align-items:center;cursor:pointer;text-align:left;width:148px}
.node:hover,.node[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.node .av{width:32px;height:32px;font-size:.8rem}
.node b{display:block;font-size:.84rem;line-height:1.2}
.node small{color:var(--muted);font-size:.72rem}
.node.out{border-style:dashed}

.qr{display:grid;grid-template-columns:repeat(21,1fr);width:160px;aspect-ratio:1;background:#fff;padding:8px;border-radius:8px;border:1px solid var(--line2);gap:0}
.qr i{background:#fff} .qr i.k{background:#111}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;z-index:20;max-width:90vw}
.toggle{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.toggle:first-child{border-top:0}
.sw{width:42px;height:24px;border-radius:99px;background:var(--line2);border:0;position:relative;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-checked="true"]{background:var(--good)} .sw[aria-checked="true"]::after{left:21px}
.steps{display:flex;gap:8px;flex-wrap:wrap}
.step{flex:1;min-width:110px;padding:8px 12px;border-radius:8px;border:1px solid var(--line2);font-weight:600;font-size:.88rem;color:var(--muted);background:var(--surface)}
.step.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.step.done{color:var(--good);border-color:var(--good)}

@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr);gap:12px}
  nav.rail{flex-direction:row;overflow-x:auto;position:static;gap:4px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  nav.rail button{white-space:nowrap;padding:7px 12px}
  nav.rail .sep{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="brand"><div class="mark">श्री</div><div><b>Shri Dasha Vaishnav Porwad Samaj</b><span id="tagline">Jaipur chapter · FY 2026-27</span></div></div>

<script>
const $=s=>document.querySelector(s);
const ico={
 home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',

const NAV=[
 ['home','Home','मुख्य पृष्ठ','home',0],['events','Events & notices','कार्यक्रम व सूचना','cal',0],['gallery','Gallery','गैलरी','img',0],
 ['directory','Directory','सदस्य सूची','users',0],['register','Register family','परिवार पंजीकरण','plus',0],['tree','Family tree','वंश वृक्ष','tree',0],

const S={role:2,hi:true,view:'home',rsvp:new Set([1]),openAlbum:null,gy:'All',gm:'All',ctab:'blood',pstep:1,members:[{n:'Mahesh Sharma',r:'Self (head)',d:'1976-04-12',g:'M'},{n:'Kavita Sharma',r:'Spouse',d:'1979-09-30',g:'F'}],

function nav(){
  const n=$('#nav');let h='';
  NAV.forEach(([id,en,hi,ic,min])=>{ if(S.role<min)return;
    h+=`<button type="button" data-go="${id}" ${S.view===id?'aria-current="page"':''}><svg viewBox="0 0 24 24">${ico[ic]}</svg>${S.hi?hi:en}</button>`});
  n.innerHTML=h;

const H={};
/* ---------- HOME ---------- */
H.home=()=>`
<div class="pagehead"><span class="lbl">${S.hi?'नमस्ते':'Namaste'}, Mahesh ji</span><h1>${S.hi?'आपके परिवार का सार':'Your family at a glance'}</h1></div>
<div class="sample">Sample data for design review. Names, amounts and photos are placeholders.</div>
<section class="hero">
  <div><span class="lbl">Sharma household · 4 members · FY 2026-27</span><h2>₹4,000 due by 31 March</h2><p class="small" style="opacity:.85;margin-top:4px">Last year's receipt #A-1182 is saved in Payments.</p></div>

</section>
<div class="grid">

</div>
<div class="grid g2">

    <div class="item"><div class="av">+</div><div><b>Deepak Soni joined Sanganer chapter</b><p class="small muted">Approved by coordinator yesterday</p></div></div></div></section>
  <section class="card"><h2 style="margin-bottom:10px">Needs your attention</h2><div class="list">

    <div class="item"><span class="pill">RSVP</span><div><b>Annual Meet: reply by 10 Nov</b></div></div></div></section>
</div>`;

 {id:1,t:'Satyanarayan Katha',d:'14',m:'NOV',when:'Sat 14 Nov 2026 · 7:00 am',v:'Shri Ram Mandir Hall, Jaipur',c:'Jaipur',type:'Religious',n:212},

const NO=[
 {t:'Dues for FY 2026-27 are open',b:'Pay ₹1,000 per member before 31 March. Families in need can ask the coordinator for a waiver.',a:'Treasurer · 1 Nov',p:'Finance'},

/* ---------- ROUTER ---------- */
function render(){
  if(!H[S.view]||(S.view==='admin'&&S.role<1))S.view='home';
  nav();$('#main').innerHTML=H[S.view]();
  if(S.view==='register')regUpdate();
  if(S.view==='tree')treeDet();
  try{history.replaceState(null,'','#'+S.view)}catch(e){}
}
function go(v){S.view=v;S.openAlbum=null;render();window.scrollTo({top:0})}
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(d.go)return go(d.go);
  if(d.occ){document.querySelectorAll('[data-occ]').forEach(b=>b.setAttribute('aria-pressed',b===t));S.occ=d.occ;return occSum()}
  if(d.amt){$('#camt').value=d.amt;return occSum()}
  if(d.vis){document.querySelectorAll('[data-vis]').forEach(b=>b.setAttribute('aria-pressed',b===t));return}
  if(d.toast)return toast(d.toast);
  if(d.rsvp){const id=+d.rsvp;S.rsvp.has(id)?S.rsvp.delete(id):S.rsvp.add(id);toast(S.rsvp.has(id)?'You are marked as attending':'RSVP removed');return render()}
  if(d.gy){S.gy=d.gy;return render()}
  if(d.album!==undefined){S.openAlbum=+d.album<0?null:+d.album;render();return window.scrollTo({top:0})}
  if(d.pstep){S.pstep=+d.pstep;return regUpdate()}
  if(d.addm!==undefined){const n=$('#m1').value.trim();if(!n)return toast('Enter the person\'s name first');S.members.push({n:n+' Sharma',r:$('#m2').value,d:$('#m3').value});$('#m1').value='';return regUpdate()}
  if(d.delm){S.members.splice(+d.delm,1);return regUpdate()}
  if(d.submit!==undefined)return toast('Sent to the Sanganer coordinator. You will get a message on approval.');
  if(d.p){S.tp=d.p;document.querySelectorAll('.node').forEach(n=>n.setAttribute('aria-pressed',n.dataset.p===S.tp));return treeDet()}
  if(d.ok!==undefined||d.no!==undefined){const i=+(d.ok??d.no);const p=S.pending[i];S.pending.splice(i,1);toast(d.ok!==undefined?'Confirmed. Receipt sent to '+p[0]:'Query sent to '+p[0]);return render()}
  if(d.rok!==undefined||d.rno!==undefined){const i=+(d.rok??d.rno);const r=S.regq[i];S.regq.splice(i,1);toast(d.rok!==undefined?r[0]+' is now a verified member':'Registration returned to '+r[0]);return render()}
  if(d.ctab){S.ctab=d.ctab;return render()}
  if(d.sw){if(d.sw==='x'||d.sw==='y'){t.setAttribute('aria-checked',t.getAttribute('aria-checked')!=='true');return}S.sw[d.sw]=!S.sw[d.sw];return render()}
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='dq'){S.dq.q=e.target.value;$('#dres').innerHTML=dirCards()}
  if(id==='camt')occSum();
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='gm'){S.gm=e.target.value;render()}
  if(id==='ds'){S.dq.s=e.target.value;S.dq.d='';S.dq.v='';render()}
  if(id==='dd'){S.dq.d=e.target.value;S.dq.v='';render()}
  if(id==='dv'){S.dq.v=e.target.value;render()}
  if(id==='role'){S.role=+e.target.value;render()}
});

const orig=new WeakMap();let obs;
function tr(){
  if(!obs)obs=new MutationObserver(()=>tr());
  obs.disconnect();
  const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;
  while((n=w.nextNode())){
    if(n.parentNode.closest('script,style'))continue;
    let o=orig.get(n);if(o===undefined){o=n.data;orig.set(n,o)}
    const t=o.trim(),h=S.hi&&HI[t];
    const v=h?o.replace(t,h):o;if(n.data!==v)n.data=v;
  }
  obs.observe(document.body,{childList:true,subtree:true});
}
$('#lang').onclick=()=>{S.hi=!S.hi;$('#lang').textContent=S.hi?'English':'हिन्दी';render();tr()};
